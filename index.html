<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BukChat</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #0b0f14;
      color: #fff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .app {
      width: 100%;
      max-width: 430px;
      min-height: 100vh;
      background: #111820;
      display: flex;
      flex-direction: column;
    }

    .header {
      padding: 22px 20px;
      background: #151e28;
      border-bottom: 1px solid #25303b;
    }

    .logo {
      font-size: 28px;
      font-weight: 700;
      color: #4ade80;
    }

    .subtitle {
      margin-top: 6px;
      color: #8b98a7;
      font-size: 14px;
    }

    .content {
      flex: 1;
      padding: 30px 20px;
      display: flex;
      align-items: center;
    }

    .card {
      width: 100%;
      background: #18212b;
      border: 1px solid #263442;
      border-radius: 18px;
      padding: 24px;
      box-shadow: 0 15px 40px rgba(0,0,0,.25);
    }

    .card h1 {
      font-size: 24px;
      margin-bottom: 8px;
    }

    .card p {
      color: #8b98a7;
      font-size: 14px;
      margin-bottom: 24px;
    }

    .input {
      width: 100%;
      padding: 14px 15px;
      margin-bottom: 12px;
      border: 1px solid #334252;
      border-radius: 12px;
      background: #101720;
      color: white;
      outline: none;
      font-size: 15px;
    }

    .input:focus {
      border-color: #4ade80;
    }

    .button {
      width: 100%;
      padding: 14px;
      border: 0;
      border-radius: 12px;
      background: #4ade80;
      color: #07120b;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 6px;
    }

    .button:hover {
      opacity: .9;
    }

    .secondary {
      background: transparent;
      color: #8b98a7;
      border: 1px solid #334252;
      margin-top: 10px;
    }

    .message {
      min-height: 20px;
      margin-top: 15px;
      font-size: 14px;
      color: #f87171;
    }

    .footer {
      padding: 18px;
      text-align: center;
      color: #566474;
      font-size: 12px;
    }
  </style>
</head>

<body>

<div class="app">

  <div class="header">
    <div class="logo">BukChat</div>
    <div class="subtitle">Private messenger</div>
  </div>

  <div class="content">

    <div class="card">

      <h1>Добро пожаловать</h1>

      <p>
        Войдите в BukChat или создайте новый аккаунт.
      </p>

      <input
        id="email"
        class="input"
        type="email"
        placeholder="Email"
      >

      <input
        id="password"
        class="input"
        type="password"
        placeholder="Пароль"
      >

      <button
        id="loginBtn"
        class="button"
        onclick="login()">
        Войти
      </button>

      <button
        id="registerBtn"
        class="button secondary"
        onclick="register()">
        Создать аккаунт
      </button>

      <div id="message" class="message"></div>

    </div>

  </div>

  <div class="footer">
    BukChat © 2026
  </div>

</div>

<script>

  const SUPABASE_URL =
    "https://iiqoalbqhrvnouhjnzc.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_NF5xdhqX1yWehvXtmmULsg_A6SS1q2j";

  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

  function showMessage(text, error = true) {
    const message = document.getElementById("message");

    message.textContent = text;
    message.style.color = error ? "#f87171" : "#4ade80";
  }

  async function register() {

    const email =
      document.getElementById("email").value.trim();

    const password =
      document.getElementById("password").value;

    if (!email || !password) {
      showMessage("Введите email и пароль.");
      return;
    }

    if (password.length < 6) {
      showMessage("Пароль должен содержать минимум 6 символов.");
      return;
    }

    showMessage("Создаём аккаунт...", false);

    const { data, error } =
      await supabaseClient.auth.signUp({
        email: email,
        password: password
      });

    if (error) {
      showMessage(error.message);
      return;
    }

    if (data.user) {
      showMessage(
        "Аккаунт создан. Проверьте email для подтверждения.",
        false
      );
    }
  }

  async function login() {

    const email =
      document.getElementById("email").value.trim();

    const password =
      document.getElementById("password").value;

    if (!email || !password) {
      showMessage("Введите email и пароль.");
      return;
    }

    showMessage("Выполняем вход...", false);

    const { data, error } =
      await supabaseClient.auth.signInWithPassword({
        email: email,
        password: password
      });

    if (error) {
      showMessage(error.message);
      return;
    }

    showMessage("Вход выполнен успешно.", false);

  }

</script>

</body>
</html>
